name: Collect crypto market data

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "25 0 * * *"
    - cron: "25 12 * * *"

permissions:
  contents: read

concurrency:
  group: crypto-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identify trigger
        run: echo "event=${{ github.event_name }} run=${{ github.run_number }} sha=${{ github.sha }}" | tee trigger.txt
      - name: Run collector unit tests
        run: python -m unittest -v
      - name: Collect public market data
        run: python collector.py
      - name: Validate output exists
        run: test -s output/market-data.json
      - name: Upload market data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_number }}
          path: |
            output/market-data.json
            trigger.txt
          if-no-files-found: error
          retention-days: 7
