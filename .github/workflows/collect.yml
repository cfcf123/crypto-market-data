name: Collect crypto market data

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 08:25 Asia/Shanghai (UTC+8)
    - cron: "25 0 * * *"
    # 20:25 Asia/Shanghai (UTC+8)
    - cron: "25 12 * * *"

permissions:
  contents: read

concurrency:
  group: crypto-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector unit tests
        run: python -m unittest -v
      - name: Collect public market data
        run: python collector.py
      - name: Upload market data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_number }}
          path: output/market-data.json
          if-no-files-found: warn
          retention-days: 7
