name: Collect crypto market data

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "25 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: crypto-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identify trigger
        run: |
          echo "event=${{ github.event_name }}" | tee trigger.txt
          echo "run_id=${{ github.run_id }}" | tee -a trigger.txt
          echo "run_number=${{ github.run_number }}" | tee -a trigger.txt
          echo "sha=${{ github.sha }}" | tee -a trigger.txt
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a trigger.txt
      - name: Run unit tests (non-blocking for collection)
        id: tests
        continue-on-error: true
        run: python -m unittest -v
      - name: Collect public market data
        run: python collector.py
      - name: Validate market data
        run: python validate_market_data.py
      - name: Generate multi-timeframe decision analysis
        run: python decision_engine.py
      - name: Report unit-test status
        if: always()
        run: echo "unit_tests=${{ steps.tests.outcome }}" | tee test-status.txt
      - name: Upload market data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_number }}
          path: |
            output/market-data.json
            output/data-quality.json
            output/trade-analysis.json
            trigger.txt
            test-status.txt
          if-no-files-found: error
          retention-days: 7
      - name: Fail workflow if unit tests failed
        if: always() && steps.tests.outcome != 'success'
        run: |
          echo "Unit tests failed; artifact was preserved for diagnosis."
          exit 1
