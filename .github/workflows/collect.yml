name: Collect crypto market data

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: crypto-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identify trigger
        run: |
          echo "event=${{ github.event_name }}" | tee trigger.txt
          echo "run_id=${{ github.run_id }}" | tee -a trigger.txt
          echo "run_number=${{ github.run_number }}" | tee -a trigger.txt
          echo "sha=${{ github.sha }}" | tee -a trigger.txt
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a trigger.txt
      - name: Run collector unit tests (non-blocking)
        id: tests
        continue-on-error: true
        run: python -m unittest -v

      - name: Collect public market data
        run: python collector.py

      - name: Validate data quality and freshness
        run: |
          python -c 'import json; from datetime import datetime, timezone; from pathlib import Path; p=Path("output/market-data.json"); d=json.loads(p.read_text()); age=(datetime.now(timezone.utc)-datetime.fromisoformat(d["generated_at"].replace("Z","+00:00"))).total_seconds(); assert p.stat().st_size>=1000; assert 0<=age<=900; assert all(s in d.get("symbols",{}) for s in ("BTCUSDT","ETHUSDT")); u={s:sum(1 for x in d["symbols"][s].get("timeframes",{}).values() if x.get("source_status")=="ok" and x.get("candles")) for s in ("BTCUSDT","ETHUSDT")}; assert all(v>=3 for v in u.values()), u; print("validated", {"age_seconds":round(age),"usable_timeframes":u})'

      - name: Report unit-test status
        if: always()
        run: echo "unit_tests=${{ steps.tests.outcome }}" | tee test-status.txt
      - name: Upload market data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_number }}
          path: |
            output/market-data.json
            trigger.txt
            test-status.txt
          if-no-files-found: error
          retention-days: 7
