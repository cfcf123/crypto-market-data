name: Market data freshness watchdog

on:
  schedule:
    # Five-minute checks, offset from the top of the hour.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: crypto-market-data-watchdog
  cancel-in-progress: true

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch collection if the latest successful snapshot is stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          runs="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --connect-timeout 5 --max-time 20 "${headers[@]}" "${base}/actions/workflows/collect.yml/runs?branch=main&per_page=20")"

          active="$(jq -r '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | sort_by(.created_at) | last // empty | [.id, .created_at] | @tsv' <<< "${runs}")"
          if [[ -n "${active}" ]]; then
            read -r active_id active_created <<< "${active}"
            active_age="$(python -c 'from datetime import datetime,timezone; import sys; print(int((datetime.now(timezone.utc)-datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))).total_seconds()))' "${active_created}")"
            if (( active_age < 900 )); then
              echo "Collection run ${active_id} is already active (${active_age}s old); no duplicate dispatch."
              exit 0
            fi
            echo "Cancelling stale active collection run ${active_id} (${active_age}s old)."
            curl --fail --silent --show-error --max-time 15 -X POST "${headers[@]}" "${base}/actions/runs/${active_id}/cancel" || true
          fi

          last_success="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.updated_at) | last | .updated_at // empty' <<< "${runs}")"
          if [[ -n "${last_success}" ]]; then
            age="$(python -c 'from datetime import datetime,timezone; import sys; print(int((datetime.now(timezone.utc)-datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))).total_seconds()))' "${last_success}")"
          else
            age=999999
          fi

          if (( age <= 600 )); then
            echo "Latest successful collection is ${age}s old (limit 600s); no dispatch needed."
            exit 0
          fi

          # Avoid repeated dispatches immediately after a failed attempt.
          latest_failure="$(jq -r '[.workflow_runs[] | select(.conclusion == "failure")] | sort_by(.created_at) | last | .created_at // empty' <<< "${runs}")"
          if [[ -n "${latest_failure}" ]]; then
            failure_age="$(python -c 'from datetime import datetime,timezone; import sys; print(int((datetime.now(timezone.utc)-datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))).total_seconds()))' "${latest_failure}")"
            if (( failure_age < 240 )); then
              echo "A collection failed ${failure_age}s ago; waiting for the next watchdog check before retry."
              exit 0
            fi
          fi

          echo "Latest successful collection is ${age}s old; dispatching a fresh collection."
          curl --fail --silent --show-error --retry 1 --retry-all-errors --connect-timeout 5 --max-time 20 -X POST "${headers[@]}" -H "Content-Type: application/json" -d '{"ref":"main"}' "${base}/actions/workflows/collect.yml/dispatches"
          echo "workflow_dispatch accepted by GitHub."
